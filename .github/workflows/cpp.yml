# C++ パーツ (cpp/) のビルドとテスト。Linux はサニタイザ付き、Windows は MSVC で回す。
# パーツ自身は何も取得しない。SQLite は Linux では apt、Windows ではランナーに入っている vcpkg で用意する。
name: cpp

on:
  push:
    branches: [main]
    paths: ['cpp/**', '.github/workflows/cpp.yml']
  pull_request:
    paths: ['cpp/**', '.github/workflows/cpp.yml']

permissions:
  contents: read

jobs:
  linux:
    name: linux (${{ matrix.config.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: debug, flags: "" }
          - { name: asan-ubsan, flags: "-fsanitize=address,undefined -fno-omit-frame-pointer" }
          - { name: tsan, flags: "-fsanitize=thread -fno-omit-frame-pointer" }
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsqlite3-dev
      # ランナーの既定 (アドレス空間の乱数化が強い) だと TSan が起動時に落ちる
      - name: Lower ASLR entropy for TSan
        if: matrix.config.name == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake -S cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_CXX_FLAGS=${{ matrix.config.flags }}"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: windows (msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite (vcpkg)
        run: vcpkg install sqlite3:x64-windows
      - name: Configure
        run: cmake -S cpp -B build "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
